
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>In-Class Graphics</title>
</head>
<body>

    <h1>In-Class Graphics</h1>

    <h2>Baltimore Heat-Related Deaths</h2>

    <iframe title="Baltimore Heat-Related Deaths"
    aria-label="Bar Chart"
    src="https://datawrapper.dwcdn.net/BXFsf/1/"
    scrolling="no"
    frameborder="0"
    style="width: 100%; border: none;"
    height="370"></iframe>

    <h2>Indoor and Outdoor Heat Index During Baltimore Heat Wave</h2>

    <iframe title="Indoor and outdoor heat index during Baltimore heat wave, July 16-22, 2019"
    aria-label="Line Chart"
    src="https://datawrapper.dwcdn.net/DfaEf/1/"
    scrolling="no"
    frameborder="0"
    style="width: 100%; border: none;"
    height="444"></iframe>

</body>
</html>
