
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Story Template</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <!-- My CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">My Story</a>

        <div class="navbar-nav">
            <a class="nav-item nav-link" href="#">Home</a>
            <a class="nav-item nav-link" href="#">About</a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">

        <!-- Headline and Byline -->
        <h1>My Story Headline Goes Here</h1>
        <p class="byline">By Mylanie Ford</p>

        <!-- First Chapter -->
        <div class="chapter">
            <h2>Chapter One</h2>
            <p>
                This is an example of a story paragraph.
                Future story content can be added here.
            </p>
        </div>

        <!-- Photo and Caption -->
        <figure>
            <img src="https://placehold.co/900x450"
                 class="img-fluid"
                 alt="Placeholder for a story photograph">

            <figcaption>Photo caption goes here.</figcaption>
        </figure>

        <!-- Second Chapter -->
        <div class="chapter">
            <h2>Chapter Two</h2>
            <p>
                This is another example paragraph.
                Additional information and story details can go here.
            </p>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>My Story Template | JOUR352</p>
    </footer>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

</body>
</html>
